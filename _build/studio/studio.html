<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ovoss Studio</title>
<style>
  html, body { margin: 0; height: 100%; background: #E4E6E9; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const params = new URLSearchParams(location.search);
const SCENE = params.get('scene') || 'range';
const BG = '#' + (params.get('bg') || 'E4E6E9');

// ---------- textures ----------
function loadImage(src) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }); }
// ?tex=b-soft loads the palette textures made by recolour.py; ?light=E3ECF6 sets the tube's colour below the label
const TEXDIR = params.get('tex') ? `tex/${params.get('tex')}/` : 'tex/';
const LIGHT = '#' + (params.get('light') || 'DCEAF4');
const TUBE = '#' + (params.get('tube') || 'F4F4F1');
const [tubeImg, cartonImg, mwFrontImg, mwBackImg] = await Promise.all(
  ['tube-label.png', 'carton.png', 'mw-front.png', 'mw-back.png'].map(f => loadImage(TEXDIR + f)));
// ?metal=1 also loads each texture's finish masks, made by mist.py: <name>-metal.png (foil) and <name>-hb.png
// (high build), white = on
const METAL = params.get('metal');
const auxOf = (src, kind) => METAL ? loadImage(src.replace('.png', `-${kind}.png`)).catch(() => null) : Promise.resolve(null);
const FILES = ['tube-label.png', 'carton.png', 'mw-front.png', 'mw-back.png'];
const [tubeMetal, cartonMetal, mwFrontMetal, mwBackMetal] = await Promise.all(FILES.map(f => auxOf(TEXDIR + f, 'metal')));
const [tubeHB, cartonHB, mwFrontHB, mwBackHB] = await Promise.all(FILES.map(f => auxOf(TEXDIR + f, 'hb')));
// ?scene=lineup&set=a,b,c: one carton per texture folder tex/<a>/ (with its masks when ?metal=1)
const SET = (params.get('set') || '').split(',').filter(Boolean);
const setImgs = await Promise.all(SET.map(async d => { const f = `tex/${d}/carton.png`; return [await loadImage(f), await auxOf(f, 'metal'), await auxOf(f, 'hb')]; }));

const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(window.devicePixelRatio || 1);
renderer.setSize(window.innerWidth, window.innerHeight, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = ({ aces: THREE.ACESFilmicToneMapping, agx: THREE.AgXToneMapping })[params.get('tonemap')] || THREE.NeutralToneMapping;
renderer.toneMappingExposure = parseFloat(params.get('exposure') || '1.0');
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.VSMShadowMap;
const maxAniso = renderer.capabilities.getMaxAnisotropy();
function tex(canvasOrImg, repeat) {
  const t = canvasOrImg instanceof HTMLCanvasElement ? new THREE.CanvasTexture(canvasOrImg) : new THREE.Texture(canvasOrImg);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = maxAniso; if (repeat) t.wrapS = THREE.RepeatWrapping; t.needsUpdate = true;
  return t;
}

// ---------- finishes ----------
// Foil: a second, mirror-like layer over the print (same geometry), cut out by the foil mask and lit by a bright
// studio reflection of its own, so it reads as foil from every angle. Its colour is the texture's (the range foil).
// High build: raised gloss UV. A height map (the mask, softened) drives the bump, with the paper/plastic grain
// baked in, and the clearcoat goes glossy on the raised areas.
const FOIL_ROUGH = parseFloat(params.get('foilrough') || '0.14'), FOIL_ENV = parseFloat(params.get('foilenv') || '1.15');
const FOIL_ROT = parseFloat(params.get('foilrot') || '1.5'), FOIL_METALNESS = parseFloat(params.get('foilmetal') || '1');
const HB_AMP = parseFloat(params.get('hb') || '0.75'), HB_BLUR = parseFloat(params.get('hbblur') || '3.5'), GRAIN_MAX = 0.08;
let foilEnvTex = null;
const foilEnv = () => PRO ? scene.environment : (foilEnvTex || (foilEnvTex = pmrem.fromScene(new RoomEnvironment(), 0.03).texture));
function canvasOf(src) { const c = document.createElement('canvas'); c.width = src.width; c.height = src.height; return c; }
function dataTex(c, repeat) { const t = new THREE.CanvasTexture(c); t.anisotropy = maxAniso; if (repeat) t.wrapS = THREE.RepeatWrapping; return t; }

// mid-grey 128 +- a few levels. Used in the carton's height map and, very faintly, in its colour.
const PAPER = (() => { const N = 1024, c = document.createElement('canvas'); c.width = c.height = N; const g = c.getContext('2d');
  g.fillStyle = 'rgb(128,128,128)'; g.fillRect(0, 0, N, N);
  for (let i = 0; i < 260; i++) { const x = Math.random() * N, y = Math.random() * N, r = 20 + Math.random() * 90, v = Math.random() < 0.5 ? 0 : 255;
    for (const [dx, dy] of [[0, 0], [N, 0], [-N, 0], [0, N], [0, -N]]) { const gr = g.createRadialGradient(x + dx, y + dy, 0, x + dx, y + dy, r);
      gr.addColorStop(0, `rgba(${v},${v},${v},0.05)`); gr.addColorStop(1, `rgba(${v},${v},${v},0)`); g.fillStyle = gr; g.fillRect(x + dx - r, y + dy - r, 2 * r, 2 * r); } }
  g.lineCap = 'round';
  for (let i = 0; i < 9000; i++) { const x = Math.random() * N, y = Math.random() * N, a = Math.random() * Math.PI, L = 4 + Math.random() * 26, v = Math.random() < 0.55 ? 255 : 0;
    g.strokeStyle = `rgba(${v},${v},${v},${0.05 + Math.random() * 0.09})`; g.lineWidth = 0.6 + Math.random() * 1.1; g.beginPath();
    const mx = x + Math.cos(a) * L / 2 + (Math.random() - 0.5) * 4, my = y + Math.sin(a) * L / 2 + (Math.random() - 0.5) * 4;
    g.moveTo(x, y); g.quadraticCurveTo(mx, my, x + Math.cos(a) * L, y + Math.sin(a) * L); g.stroke(); }
  const d = g.getImageData(0, 0, N, N), p = d.data;
  for (let i = 0; i < p.length; i += 4) { const v = p[i] + (Math.random() - 0.5) * 26; p[i] = p[i + 1] = p[i + 2] = v; }
  // stretch to a set contrast (std 40 levels around 128) so the strength params mean the same thing
  let sum = 0, sq = 0, n = p.length / 4; for (let i = 0; i < p.length; i += 4) { sum += p[i]; sq += p[i] * p[i]; }
  const mean = sum / n, sd = Math.sqrt(Math.max(1, sq / n - mean * mean));
  for (let i = 0; i < p.length; i += 4) { const v = 128 + (p[i] - mean) / sd * 40; p[i] = p[i + 1] = p[i + 2] = v; }
  g.putImageData(d, 0, 0); return c; })();
function paperize(img, foilSrc) { // the artwork with the paper tile multiplied in (+-strength around 1); not on the foil
  const c = canvasOf(img), g = c.getContext('2d'); g.drawImage(img, 0, 0);
  let fm = null; if (foilSrc) { const fc = canvasOf(img), fg = fc.getContext('2d'); fg.drawImage(foilSrc, 0, 0, c.width, c.height); fm = fg.getImageData(0, 0, c.width, c.height).data; }
  const pc = canvasOf(img), pg = pc.getContext('2d'); pg.fillStyle = pg.createPattern(PAPER, 'repeat'); pg.fillRect(0, 0, pc.width, pc.height);
  const d = g.getImageData(0, 0, c.width, c.height), p = d.data, q = pg.getImageData(0, 0, c.width, c.height).data, k = parseFloat(params.get('paperink') || '0.1');
  for (let i = 0; i < p.length; i += 4) { const f = 1 + (q[i] - 128) / 128 * k * (fm ? 1 - fm[i] / 255 : 1); p[i] *= f; p[i + 1] *= f; p[i + 2] *= f; }
  g.putImageData(d, 0, 0); return c;
}

  const c = canvasOf(hbSrc), g = c.getContext('2d');
  g.fillStyle = '#000'; g.fillRect(0, 0, c.width, c.height); g.filter = `blur(${HB_BLUR}px)`; g.drawImage(hbSrc, 0, 0); g.filter = 'none';
  const d = g.getImageData(0, 0, c.width, c.height), p = d.data;
  let pp = null;
  if (paper && grain) { const pc = canvasOf(hbSrc), pg = pc.getContext('2d'); pg.fillStyle = pg.createPattern(PAPER, 'repeat'); pg.fillRect(0, 0, pc.width, pc.height); pp = pg.getImageData(0, 0, pc.width, pc.height).data; }
  const PG = parseFloat(params.get('paperbump') || '2.5');
  for (let i = 0; i < p.length; i += 4) { const h = p[i] / 255, n = pp ? (pp[i] - 128) / 255 * PG : (Math.random() - 0.5);
    const v = Math.max(0, Math.min(255, 31 + n * grain * 255 * (1 - h) + p[i] * HB_AMP)); p[i] = p[i + 1] = p[i + 2] = v; p[i + 3] = 255; }
  g.putImageData(d, 0, 0); return dataTex(c, repeat);
}
const HB_CC = parseFloat(params.get('hbcc') || '0.22'), HB_CCR = parseFloat(params.get('hbccr') || '0.15');
function glossTex(hbSrc, cc, ccRough, repeat) { // clearcoat in R, its roughness in G (the channels three.js reads)
  const c = canvasOf(hbSrc), g = c.getContext('2d'); g.drawImage(hbSrc, 0, 0);
  const d = g.getImageData(0, 0, c.width, c.height), p = d.data;
  for (let i = 0; i < p.length; i += 4) { const h = p[i] / 255; p[i] = Math.round((cc + (Math.max(cc, HB_CC) - cc) * h) * 255); p[i + 1] = Math.round((ccRough * (1 - h) + HB_CCR * h) * 255); p[i + 2] = 0; p[i + 3] = 255; }

}
// base: the printed material. grain/bump: the material's original grain amplitude (0-1) and bump scale.
function highBuild(mat, hbSrc, grain, effGrain, repeat, paper) {
  if (!hbSrc) return null;
  const gr = Math.min(GRAIN_MAX, grain);
  mat.bumpMap = heightTex(hbSrc, gr, repeat, paper); mat.bumpScale = effGrain / gr;
  mat.userData.smoothBump = heightTex(hbSrc, 0, repeat); // for the foil layer: same raise, no grain
  mat.clearcoatMap = mat.clearcoatRoughnessMap = glossTex(hbSrc, mat.clearcoat, mat.clearcoatRoughness, repeat);
  mat.clearcoat = 1; mat.clearcoatRoughness = 1;
  return mat.bumpMap;
}
function foilLayer(geo, colourTex, maskSrc, bump, bumpScale, repeat) {
  if (!maskSrc) return null;
  const alpha = dataTex(maskSrc instanceof HTMLCanvasElement ? maskSrc : (() => { const c = canvasOf(maskSrc); c.getContext('2d').drawImage(maskSrc, 0, 0); return c; })(), repeat);
  const m = new THREE.MeshPhysicalMaterial({ map: colourTex, alphaMap: alpha, transparent: true, depthWrite: false,
    metalness: 1, roughness: FOIL_ROUGH, envMap: foilEnv(), envMapIntensity: FOIL_ENV, clearcoat: 0.5, clearcoatRoughness: 0.05,
    polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 });
  m.envMapRotation = new THREE.Euler(0, Math.PI * FOIL_ROT, 0); m.metalness = FOIL_METALNESS;
  if (PRO) { // the foil's metallic look is painted into the texture (multi-stop ramps, mist_tex.py); a little real gloss on top
    m.envMapRotation = new THREE.Euler(0, Math.PI * parseFloat(params.get('envrot') || '-0.15'), 0);
    m.metalness = parseFloat(params.get('foilmetal') || '0.2'); m.roughness = parseFloat(params.get('foilrough') || '0.3'); m.envMapIntensity = 0.7; m.clearcoat = 0.35; m.clearcoatRoughness = 0.15; }

}

const scene = new THREE.Scene();
scene.background = new THREE.Color(BG);
const pmrem = new THREE.PMREMGenerator(renderer);
// ?look=pro (default with metal=1): a product-shoot studio instead of the soft HDRI. A dim room, a gradient reflector
// behind the camera, strip softboxes left and right, rim strips behind and a top box, so gloss and foil throw
// real highlights. Panels are HDR (colour x intensity), like three's RoomEnvironment.
const PRO = params.get('look') ? params.get('look') === 'pro' : !!METAL;
function studioEnv() {
  const s = new THREE.Scene(), I = parseFloat(params.get('strip') || '1');
  const room = new THREE.Mesh(new THREE.BoxGeometry(60, 30, 60), new THREE.MeshBasicMaterial({ color: new THREE.Color(params.get('room') ? '#' + params.get('room') : '#5d636c'), side: THREE.BackSide }));
  room.position.y = 12; s.add(room);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshBasicMaterial({ color: new THREE.Color(0x9aa0a8) }));
  floor.rotation.x = -Math.PI / 2; floor.position.y = -2.9; s.add(floor);
  const grad = (stops) => { const c = document.createElement('canvas'); c.width = 4; c.height = 256; const g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 256);
    stops.forEach(([o, v]) => gr.addColorStop(o, `rgb(${v},${v},${v})`)); g.fillStyle = gr; g.fillRect(0, 0, 4, 256); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; };
  const panel = (w, h, x, y, z, inten, map) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h),
      new THREE.MeshBasicMaterial({ color: new THREE.Color(1, 1, 1).multiplyScalar(inten * I), map: map || null, side: THREE.DoubleSide }));
    m.position.set(x, y, z); m.lookAt(0, y * 0.35, 0); s.add(m); };
  panel(22, 22, 0, 6, 16, 1.2, grad([[0, 255], [0.32, 235], [0.5, 90], [0.62, 30], [1, 12]]));  // gradient reflector behind the camera
  panel(4, 16, -13, 6, 9, 9);      // key strip, front left
  panel(8, 16, 13, 5, 8, 9);       // fill strip, front right
  panel(3, 16, 11, 7, -12, 8);     // rim strip, back right
  panel(6, 16, -11, 6, -12, 8);    // rim strip, back left
  const top = new THREE.Mesh(new THREE.PlaneGeometry(14, 10), new THREE.MeshBasicMaterial({ color: new THREE.Color(1, 1, 1).multiplyScalar(3 * I) }));
  top.position.set(0, 18, 2); top.rotation.x = Math.PI / 2; s.add(top);
  return pmrem.fromScene(s, 0.0, 0.1, 200).texture;
}
if (PRO) {
  scene.environment = studioEnv();
  scene.environmentRotation = new THREE.Euler(0, Math.PI * parseFloat(params.get('envrot') || '-0.15'), 0);
  document.body.dataset.env = 'hdr';
} else try {
  const hdr = await new RGBELoader().loadAsync('https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/studio_small_09_1k.hdr');
  hdr.mapping = THREE.EquirectangularReflectionMapping;
  scene.environment = pmrem.fromEquirectangular(hdr).texture;
  scene.environmentRotation = new THREE.Euler(0, Math.PI * parseFloat(params.get('envrot') || '1.0'), 0);
  document.body.dataset.env = 'hdr';
} catch (e) { scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture; document.body.dataset.env = 'room'; }
scene.environmentIntensity = PRO ? parseFloat(params.get('envint') || '0.6') : 0.8;
const key = new THREE.DirectionalLight(0xffffff, PRO ? parseFloat(params.get('key') || '2.3') : 1.25);
key.castShadow = true; key.shadow.mapSize.set(4096, 4096); key.shadow.radius = 14; key.shadow.blurSamples = 25; key.shadow.bias = -0.0004;
const sc = key.shadow.camera; sc.left = -260; sc.right = 260; sc.top = 260; sc.bottom = -260; sc.near = 10; sc.far = 1600;
scene.add(key); scene.add(key.target);
scene.add(new THREE.AmbientLight(0xffffff, 0.05));
const ground = new THREE.Mesh(new THREE.PlaneGeometry(4000, 4000), new THREE.ShadowMaterial({ opacity: 0.2 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

// soft contact shadow under each object
const contactTex = (() => { const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d');
  const gr = g.createRadialGradient(128, 128, 0, 128, 128, 128); gr.addColorStop(0, 'rgba(20,28,40,0.55)'); gr.addColorStop(0.55, 'rgba(20,28,40,0.16)'); gr.addColorStop(1, 'rgba(20,28,40,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 256, 256); return new THREE.CanvasTexture(c); })();
function contact(w, d) { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), new THREE.MeshBasicMaterial({ map: contactTex, transparent: true, depthWrite: false, opacity: 0.7 }));
  m.rotation.x = -Math.PI / 2; m.position.y = 0.05; return m; }

function grain(size, amt) { const c = document.createElement('canvas'); c.width = c.height = size; const g = c.getContext('2d'); const d = g.createImageData(size, size);
  for (let i = 0; i < d.data.length; i += 4) { const v = 128 + (Math.random() - 0.5) * amt; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  g.putImageData(d, 0, 0); const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; return t; }

    const v = new THREE.Vector3(n.getX(a) + n.getX(b), n.getY(a) + n.getY(b), n.getZ(a) + n.getZ(b)).normalize();

// ---------- toothpaste tube (Multitubes Ø35 x 120, label 114 x 103) ----------
function makeTube() {

  const W = Math.round(P * PX), H = Math.round(LEN * PX), k = tubeImg.width / (LAB_R - LAB_L);

  g.fillStyle = LIGHT; g.fillRect(0, ly + lh - 2, W, H - (ly + lh) + 2); // the light colour runs down to the cap

  const semiA = b => { let lo = b, hi = P / 4 + 2; for (let i = 0; i < 50; i++) { const m = (lo + hi) / 2; if (perim(m, b) < P) lo = m; else hi = m; } return (lo + hi) / 2; };

  const mat = new THREE.MeshPhysicalMaterial({ map: tex(cv, true), roughness: 0.32, clearcoat: 0.8, clearcoatRoughness: 0.08, bumpMap: plasticGrain, bumpScale: 0.6 });
  mat.bumpMap.repeat.set(6, 6);
  const layout = img => { if (!img) return null; // a mask laid out exactly like the label above
    const c = document.createElement('canvas'); c.width = W; c.height = H; const mg = c.getContext('2d');
    mg.fillStyle = '#000'; mg.fillRect(0, 0, W, H);
    mg.drawImage(img, (LAB_R - P - LAB_L) * k, 0, (X0 + P - LAB_R) * k, tubeImg.height, seam, ly, W - seam, lh);
    mg.drawImage(img, (X0 - LAB_L) * k, 0, (LAB_R - X0) * k, tubeImg.height, 0, ly, seam, lh); return c; };
  const tubeBump = highBuild(mat, layout(tubeHB), 40 / 255, 40 / 255 * 0.6, true);
  const grp = new THREE.Group();
  const body = finish(new THREE.Mesh(geo, mat)); body.position.y = 20; grp.add(body);
  const tubeFoil = foilLayer(geo, mat.map, layout(tubeMetal), mat.userData.smoothBump, mat.bumpScale, true); if (tubeFoil) { tubeFoil.position.y = 20; grp.add(tubeFoil); }
  const b = depth(LEN), seal = new THREE.Shape(); seal.absellipse(0, 0, semiA(b), b, 0, Math.PI * 2);
  const sealMat = white(); sealMat.color = new THREE.Color(TUBE).convertSRGBToLinear();
  const top = new THREE.Mesh(new THREE.ShapeGeometry(seal, 64), sealMat); top.rotation.x = -Math.PI / 2; top.position.y = 140; grp.add(top);
  // stand-up flip cap
  const capPts = [[0, 0], [15.9, 0], [17.6, 0.7], [17.9, 2.2], [17.9, 13], [17.55, 13.5], [17.9, 14], [17.9, 18.8], [17.4, 19.8], [12, 20.3], [0, 20.3]].map(([x, y]) => new THREE.Vector2(x, y));
  grp.add(finish(new THREE.Mesh(new THREE.LatheGeometry(capPts, 128), white(0.4, 0.3))));
  grp.add(contact(70, 70));
  grp.userData.h = 140;
  return grp;
}

// ---------- carton (42 x 42 x 140), mapped from the dieline sheet ----------
function makeCarton(img = cartonImg, metalImg = cartonMetal, hbImg = cartonHB) {
  const AW = 276.44, AH = 320.03, uv = (x, y) => [x / AW, y / AH];
  const faces = [ // corners as [x,y,z] with sheet coordinates in mm, listed counter-clockwise from outside
    [[-21, 0, 21, 148.87, 91.93], [21, 0, 21, 190.87, 91.93], [21, 140, 21, 190.87, 231.93], [-21, 140, 21, 148.87, 231.93]],   // front
    [[21, 0, 21, 190.87, 91.93], [21, 0, -21, 232.37, 91.93], [21, 140, -21, 232.37, 231.93], [21, 140, 21, 190.87, 231.93]],   // right side
    [[21, 0, -21, 64.87, 91.93], [-21, 0, -21, 106.87, 91.93], [-21, 140, -21, 106.87, 231.93], [21, 140, -21, 64.87, 231.93]], // back
    [[-21, 0, -21, 106.87, 91.93], [-21, 0, 21, 148.87, 91.93], [-21, 140, 21, 148.87, 231.93], [-21, 140, -21, 106.87, 231.93]], // left side
    [[21, 140, -21, 64.87, 231.93], [-21, 140, -21, 106.87, 231.93], [-21, 140, 21, 106.87, 273.93], [21, 140, 21, 64.87, 273.93]], // top lid
    [[-21, 0, 21, 148.87, 91.93], [21, 0, 21, 190.87, 91.93], [21, 0, -21, 190.87, 49.93], [-21, 0, -21, 148.87, 49.93]],     // bottom flap
  ];
  const pos = [], uvs = [], idx = [];
  faces.forEach(f => {
    const base = pos.length / 3, c = new THREE.Vector3(), p = f.map(q => new THREE.Vector3(q[0], q[1], q[2]));
    p.forEach(v => c.add(v)); c.multiplyScalar(0.25);
    const nrm = new THREE.Vector3().crossVectors(p[1].clone().sub(p[0]), p[2].clone().sub(p[0]));
    const out = c.clone().sub(new THREE.Vector3(0, 70, 0));
    const order = nrm.dot(out) > 0 ? [0, 1, 2, 3] : [0, 3, 2, 1];
    order.forEach(o => { pos.push(f[o][0], f[o][1], f[o][2]); uvs.push(...uv(f[o][3], f[o][4])); });
    idx.push(base, base + 1, base + 2, base, base + 2, base + 3);
  });
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2)); g.setIndex(idx); g.computeVertexNormals();
  const mat = new THREE.MeshPhysicalMaterial({ map: tex(PRO ? paperize(img, metalImg) : img), roughness: PRO ? parseFloat(params.get('boardrough') || '0.72') : 0.62, specularIntensity: PRO ? parseFloat(params.get('boardspec') || '0.15') : 1, clearcoat: PRO ? parseFloat(params.get('boardcc') || '0.12') : 0.35,
    clearcoatRoughness: PRO ? 0.18 : 0.22, bumpMap: paperGrain, bumpScale: 1.2 });
  mat.bumpMap.repeat.set(10, 10);
  const cartonBump = highBuild(mat, hbImg, 90 / 255, 90 / 255 * 1.2, false, PRO);
  const grp = new THREE.Group(); grp.add(finish(new THREE.Mesh(g, mat))); grp.add(contact(80, 80));
  const cartonFoil = foilLayer(g, mat.map, metalImg, mat.userData.smoothBump, mat.bumpScale, false); if (cartonFoil) grp.add(cartonFoil);
  grp.userData.h = 140;
  return grp;
}

// ---------- 500 ml mouthwash bottle: clear PET, transparent contents (Greg, 10 Nov) ----------
// Shape follows the Ardoz sample Greg sent (O7 Active 500 ml): flat oval body with a pinched waist,
// rounded shoulders, tall white ribbed dosing cap. Sized to carry Ardoz's 59 x 125 mm labels.
function makeBottle() {
  const A = 36, B = 24, N = 2.8, NECK = 13.6, BODY_TOP = 160, SH_TOP = 181, NECK_TOP = 192, BASE_R = 7,
        FILL = 170, LAB_Y = 18, LW = 59, LH = 125, PX = 16;
  const waist = y => 1 - 0.1 * Math.exp(-Math.pow((y - 82) / 32, 2));
  const sect = y => {
    if (y <= BASE_R) { const off = BASE_R - Math.sqrt(Math.max(0, BASE_R * BASE_R - (BASE_R - y) * (BASE_R - y))); const w = waist(y); return { a: A * w - off, b: B - off, n: N }; }
    if (y <= BODY_TOP) { const w = waist(y); return { a: A * w, b: B * (1 - (1 - w) * 0.4), n: N }; }
    if (y <= SH_TOP) { const t = Math.min(1, (y - BODY_TOP) / (SH_TOP - BODY_TOP)), e = 1 - Math.pow(1 - Math.pow(t, 2.2), 1 / 2.2);
      return { a: A + (NECK - A) * e, b: B + (NECK - B) * e, n: N + (2 - N) * e }; }
    return { a: NECK, b: NECK, n: 2 };
  };
  const grp = new THREE.Group();
  // body: the filled part is one thick transparent volume, the headspace above the fill line a thin shell
  const glass = (thickness, ior) => new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.03, metalness: 0, transmission: 1,
    thickness, ior, specularIntensity: 1, attenuationColor: new THREE.Color(0xe2eaee), attenuationDistance: 380, envMapIntensity: 0.85 });
  const uvNone = () => [0, 0], uvBody = (s, tot, y) => [s / 2, y / 2];
  const lower = sweep([...range(0, BASE_R, 12), ...range(BASE_R + 1, FILL, 60)], sect, 240, uvBody);
  const upper = sweep([...range(FILL, SH_TOP, 30), ...range(SH_TOP + 0.5, NECK_TOP, 6)], sect, 240, uvBody);
  // clear plastic casts a lighter shadow: a fine stipple in the shadow pass, softened by the VSM blur
  const stipple = (() => { const c = document.createElement('canvas'); c.width = c.height = 4; const g = c.getContext('2d'); g.fillStyle = '#000'; g.fillRect(0, 0, 4, 4);
    g.fillStyle = '#fff'; [[0, 0], [2, 0], [1, 1], [3, 1], [0, 2], [2, 2], [1, 3]].forEach(([x, y]) => g.fillRect(x, y, 1, 1)); const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping; t.magFilter = t.minFilter = THREE.NearestFilter; t.generateMipmaps = false; return t; })();
  const shadowDepth = new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking, alphaMap: stipple, alphaTest: 0.5 });
  [[lower, glass(12, 1.34)], [upper, glass(1.2, 1.57)]].forEach(([g, m]) => { const mesh = new THREE.Mesh(g, m); mesh.castShadow = true; mesh.customDepthMaterial = shadowDepth; grp.add(mesh); });
  const shapeAt = (y, grow = 0) => { const s = sect(y), e = 2 / s.n, sh = new THREE.Shape();
    for (let k = 0; k <= 128; k++) { const ph = 2 * Math.PI * k / 128; const x = (s.a + grow) * Math.sign(Math.sin(ph)) * Math.pow(Math.abs(Math.sin(ph)), e), z = (s.b + grow) * Math.sign(Math.cos(ph)) * Math.pow(Math.abs(Math.cos(ph)), e); if (k) sh.lineTo(x, z); else sh.moveTo(x, z); }
    return sh; };
  const base = new THREE.Mesh(new THREE.ShapeGeometry(shapeAt(0)), glass(4, 1.57)); base.rotation.x = Math.PI / 2; base.position.y = 0.02; grp.add(base);
  // the liquid's surface, a faint line just under the shoulder
  const surf = new THREE.Mesh(new THREE.ShapeGeometry(shapeAt(FILL, -0.6)), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.22, depthWrite: false }));
  surf.rotation.x = -Math.PI / 2; surf.position.y = FILL; grp.add(surf);
  const ring = new THREE.Mesh(sweep([FILL - 0.5, FILL + 0.4], y => { const s = sect(y); return { a: s.a + 0.05, b: s.b + 0.05, n: s.n }; }, 240, uvNone),
    new THREE.MeshBasicMaterial({ color: 0x9aa6b2, transparent: true, opacity: 0.35, depthWrite: false }));
  grp.add(ring);
  // labels: a patch of the body surface, sized by arc length, printed outside and plain white inside
  const labelGeo = centre => {
    const K = 1440, pos = [], uv = [], idx = [], rows = 90, cols = 120;
    for (let i = 0; i <= rows; i++) {
      const y = LAB_Y + LH * i / rows, s = sect(y), a = s.a + 0.25, b = s.b + 0.25, e = 2 / s.n;
      const pt = ph => [a * Math.sign(Math.sin(ph)) * Math.pow(Math.abs(Math.sin(ph)), e), b * Math.sign(Math.cos(ph)) * Math.pow(Math.abs(Math.cos(ph)), e)];
      const cum = new Float64Array(K + 1); let [px, pz] = pt(-Math.PI);
      for (let k = 1; k <= K; k++) { const [x, z] = pt(-Math.PI + 2 * Math.PI * k / K); cum[k] = cum[k - 1] + Math.hypot(x - px, z - pz); px = x; pz = z; }
      const tot = cum[K], c = centre === 'front' ? tot / 2 : 0;
      for (let j = 0; j <= cols; j++) {
        let target = c - LW / 2 + LW * j / cols; target = ((target % tot) + tot) % tot;
        let lo = 0, hi = K; while (hi - lo > 1) { const m = (lo + hi) >> 1; if (cum[m] <= target) lo = m; else hi = m; }
        const f = (target - cum[lo]) / Math.max(1e-9, cum[lo + 1] - cum[lo]);
        const [x, z] = pt(-Math.PI + 2 * Math.PI * (lo + f) / K);
        pos.push(x, y, z); uv.push(j / cols, i / rows);
      }
    }
    for (let i = 0; i < rows; i++) for (let j = 0; j < cols; j++) { const p = i * (cols + 1) + j, q = p + cols + 1; idx.push(p, p + 1, q, p + 1, q + 1, q); }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2)); g.setIndex(idx); g.computeVertexNormals();
    return g;
  };
  const corners = (() => { const c = document.createElement('canvas'); c.width = LW * PX; c.height = LH * PX; const g = c.getContext('2d');
    g.fillStyle = '#000'; g.fillRect(0, 0, c.width, c.height); g.fillStyle = '#fff'; g.beginPath(); g.roundRect(0, 0, c.width, c.height, 2.5 * PX); g.fill();
    return new THREE.CanvasTexture(c); })();
  [['front', mwFrontImg, mwFrontMetal, mwFrontHB], ['back', mwBackImg, mwBackMetal, mwBackHB]].forEach(([side, img, metalImg, hbImg]) => {
    const geo = labelGeo(side);
    const printed = new THREE.MeshPhysicalMaterial({ map: tex(img), alphaMap: corners, alphaTest: 0.5, transparent: true, depthWrite: true, roughness: 0.36, clearcoat: 0.55, clearcoatRoughness: 0.14, bumpMap: plasticGrain, bumpScale: 0.25 });
    printed.bumpMap.repeat.set(4, 4);
    const labelBump = highBuild(printed, hbImg, 40 / 255, 40 / 255 * 0.25, false);
    const back = new THREE.MeshStandardMaterial({ color: new THREE.Color('#' + (params.get('lback') || 'F2F2EF')).convertSRGBToLinear(), roughness: 0.7, alphaMap: corners, alphaTest: 0.5, transparent: true, depthWrite: true, side: THREE.BackSide });
    const m1 = new THREE.Mesh(geo, printed); m1.receiveShadow = true; grp.add(m1);
    const labelFoil = foilLayer(geo, printed.map, metalImg, printed.userData.smoothBump, printed.bumpScale, false); if (labelFoil) grp.add(labelFoil);
    grp.add(new THREE.Mesh(geo, back));
  });
  // tall ribbed dosing cap with a tamper band
  const C0 = SH_TOP + 3.5;
  const band = [[NECK + 0.2, C0], [16.4, C0], [16.8, C0 + 0.4], [16.8, C0 + 3.2], [16.4, C0 + 3.6], [NECK + 0.2, C0 + 3.6]].map(([x, y]) => new THREE.Vector2(x, y));
  grp.add(finish(new THREE.Mesh(new THREE.LatheGeometry(band, 180), white(0.42, 0.25))));
  const K0 = C0 + 4.4, KH = 48;
  const capPts = [[0, K0], [16.6, K0], [17.1, K0 + 0.5], [17.1, K0 + 1.5], [16.5, K0 + KH - 2.2], [16.0, K0 + KH - 0.6], [15.0, K0 + KH], [0, K0 + KH]].map(([x, y]) => new THREE.Vector2(x, y));
  const capGeo = new THREE.LatheGeometry(capPts, 240);
  { const p = capGeo.attributes.position; for (let i = 0; i < p.count; i++) { const x = p.getX(i), z = p.getZ(i), y = p.getY(i), r = Math.hypot(x, z);
      if (r > 15.5 && y > K0 + 1.2 && y < K0 + KH - 2.4) { const ang = Math.atan2(z, x), rr = r - 0.24 * (0.5 + 0.5 * Math.cos(ang * 120)); p.setXYZ(i, Math.cos(ang) * rr, y, Math.sin(ang) * rr); } }
    capGeo.computeVertexNormals(); }
  grp.add(finish(new THREE.Mesh(capGeo, white(0.4, 0.28))));
  // clear plastic casts a light shadow, so only a soft contact shadow
  const cs = contact(118, 84); cs.material.opacity = 0.45; grp.add(cs);
  grp.userData.h = K0 + KH;
  return grp;
}

// ---------- compositions ----------
const deg = d => d * Math.PI / 180;
const objs = [];
function place(o, x, z, rotDeg) { o.position.set(x, 0, z); o.rotation.y = deg(rotDeg); scene.add(o); objs.push(o); return o; }
const S = {
  'toothpaste': () => { place(makeCarton(), -25, -4, 28); place(makeTube(), 27, 6, -16); return { el: 9, az: 0, m: 1.16 }; },
  'mouthwash': () => { place(makeBottle(), 0, 0, 24); return { el: 8, az: 0, m: 1.12 }; },
  'range': () => { place(makeCarton(), -72, 0, 26); place(makeBottle(), 0, -12, 12); place(makeTube(), 66, 8, -14); return { el: 9, az: 0, m: 1.16 }; },
  'tube-front': () => { place(makeTube(), 0, 0, 0); return { el: 4, az: 0 }; },
  'tube-back': () => { place(makeTube(), 0, 0, 180); return { el: 4, az: 0 }; },
  'carton-front': () => { place(makeCarton(), 0, 0, 30); return { el: 8, az: 0 }; },
  'carton-back': () => { place(makeCarton(), 0, 0, 210); return { el: 8, az: 0 }; },
  'carton-side': () => { place(makeCarton(), 0, 0, -60); return { el: 8, az: 0 }; },
  'mw-front': () => { place(makeBottle(), 0, 0, 18); return { el: 6, az: 0 }; },
  'mw-back': () => { place(makeBottle(), 0, 0, 198); return { el: 6, az: 0 }; },
  'lineup': () => { const n = setImgs.length, gap = parseFloat(params.get('gap') || '62');
    setImgs.forEach(([im, mt, hb], i) => place(makeCarton(im, mt, hb), (i - (n - 1) / 2) * gap, 0, parseFloat(params.get('rot') || '22')));
    return { el: 11, az: 0, m: 1.3 }; },
};
const view = (S[SCENE] || S.range)();

// frame everything with a margin
const box = new THREE.Box3(); objs.forEach(o => box.expandByObject(o.children[0]));
objs.forEach(o => o.children.forEach(c => { if (c.geometry && c.geometry.type !== 'PlaneGeometry') box.expandByObject(c); }));
const size = box.getSize(new THREE.Vector3()), centre = box.getCenter(new THREE.Vector3());
const aspect = window.innerWidth / window.innerHeight, fov = 22, margin = parseFloat(params.get('margin') || String(view.m || 1.14));
const camera = new THREE.PerspectiveCamera(fov, aspect, 1, 10000);
const halfH = Math.max(size.y / 2, size.x / 2 / aspect, size.z / 2 / aspect) * margin;
const dist = halfH / Math.tan(deg(fov / 2)) + size.z / 2;
const E = deg(view.el), Az = deg(view.az);
const target = centre.clone(); target.y = size.y * 0.5 - size.y * 0.02;
camera.position.set(target.x + dist * Math.sin(Az) * Math.cos(E), target.y + dist * Math.sin(E), target.z + dist * Math.cos(Az) * Math.cos(E));
camera.lookAt(target);
// key light from the upper left, a little in front
if (PRO) { // softbox look: light from high up, so shadows are short and soft and pool under the packs
  key.position.set(target.x - 420, 1450, target.z + 300); key.shadow.radius = 34; key.shadow.blurSamples = 48;
  { const c = key.shadow.camera; c.left = -900; c.right = 900; c.top = 900; c.bottom = -900; c.near = 10; c.far = 4000; c.updateProjectionMatrix(); key.shadow.mapSize.set(8192, 8192); key.shadow.map = null; }
  ground.material.opacity = parseFloat(params.get('shadow') || '0.27');
  objs.forEach(o => o.children.forEach(c => { if (c.material && c.material.map === contactTex) { c.material.opacity = 0.95; c.scale.multiplyScalar(0.92); } }));
} else key.position.set(target.x - 300, 950, target.z + 560);
key.target.position.copy(target).setY(0);

renderer.render(scene, camera);
const gl = renderer.getContext(), dbg = gl.getExtension('WEBGL_debug_renderer_info');
document.body.dataset.gpu = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : 'n/a';
document.body.dataset.ready = '1';
</script>
